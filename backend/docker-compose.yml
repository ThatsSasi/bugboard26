services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bugboard26_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      # L'host 'db' corrisponde al nome del servizio sopra
      - DATABASE_URL=postgresql://postgres:admin@db:5432/bugboard26_db
      - JWT_SECRET=7b3f9c8d4e2a1f6b5c0d9e8a7f6b5c4d3e2a1f0b9c8d7e6a5b4c3d2e1f0a9b8c
    depends_on:
      - db

volumes:
  pgdata: